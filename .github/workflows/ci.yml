# Tests and a full build on every push to the GitHub mirror. Builds run here,
# off the homelab, never on its cluster.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: go
        run: |
          test -z "$(gofmt -l cmd internal web/embed.go)" || { gofmt -l cmd internal web/embed.go; exit 1; }
          go vet ./...
          go test -race ./...
      - name: binary with the UI embedded
        run: |
          go build -o agentmd ./cmd/agentmd
          ./agentmd version
      - name: end-to-end
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          AGENTMD_BIN=../agentmd npm run e2e
