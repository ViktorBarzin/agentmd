version: 2
project_name: agentmd

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - main: ./cmd/agentmd
    binary: agentmd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "agentmd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc

release:
  github:
    owner: ViktorBarzin
    name: agentmd
